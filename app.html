:root{--bg:#faf5ef;--card:#fffdf9;--ink:#2a2a32;--mute:#7d7782;--g:#da825c;--g2:#f7e3d8;--warn:#b5483f;--line:#eadfd3;--r:20px;--y:#fbf0d0;--gr:#e3ede5;--lv:#ebe7f5;--bl:#dfecf4}
body.dark{--bg:#232228;--card:#2e2d35;--ink:#f4eee6;--mute:#a49eab;--g:#e8946f;--g2:#3d312d;--warn:#f08f84;--line:#3b3a43;--y:#3a3527;--gr:#2b3630;--lv:#34314a;--bl:#2a3641}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:18px;margin:18px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(60,40,20,.07)}
.hero{text-align:center;padding:26px 16px;background:var(--y)}
.hero .lbl{color:var(--g);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.big{font-size:54px;font-weight:800;line-height:1.15;color:var(--ink)}.big.neg{color:var(--warn)}
.sub{color:var(--mute);font-size:15px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .grow{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;white-space:nowrap}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form .full{grid-column:1/-1}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--g);color:#fff;font-weight:700;cursor:pointer}
button.ghost{background:var(--g2);color:var(--ink)}button.x{background:none;color:var(--mute);padding:6px 10px;font-size:20px}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--g);background:none;padding:0;color:#fff;font-size:17px}.chk.on{background:var(--g)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;color:var(--mute);padding:6px 8px;font-size:13px;font-weight:600;flex:1}nav button.on{color:var(--g)}nav span{display:block;font-size:22px}
.bar{height:12px;border-radius:8px;background:var(--lv);overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 14px;border-radius:20px;font-size:14px;font-weight:600}.chips button:nth-child(3n+1){border-color:var(--g)}.chips button:nth-child(3n+2){border-color:#8fb59a}.chips button:nth-child(3n){border-color:#a99fd0}.chips button.on{background:var(--g);border-color:var(--g);color:#fff}
.demo{background:#fff4d6;color:#5b4500;text-align:center;padding:10px;font-size:14px;font-weight:600}
.lock{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}.lock div{background:var(--card);border-radius:var(--r);padding:24px;max-width:380px;text-align:center}
.three div{display:flex;gap:10px;align-items:center;padding:8px 10px;margin:6px 0;border-radius:14px;background:var(--gr)}.three div:nth-of-type(2){background:var(--lv)}.three div:nth-of-type(3){background:var(--bl)}.three i{font-style:normal;font-size:22px}
</style></head><body>
<script>const DEMO=false;const LIMIT=15;</script>
<div id="app"></div>
<script>
const CATS=['Food','Transport','Home','Fun','Health','Other'];
const KEY=DEMO?'calmbudget_demo_v1':'calmbudget_v1';
const mk=()=>new Date().toISOString().slice(0,7);
let S,tab='today',month=mk(),cat='Food',changes=0,locked=false;
const uid=()=>Math.random().toString(36).slice(2,9);
function sample(){const m=mk();return{cur:'$',dark:false,focus:false,
income:[{id:uid(),name:'Paycheck 1',amt:1450,date:m+'-01'},{id:uid(),name:'Paycheck 2',amt:1450,date:m+'-15'}],
bills:[{id:uid(),name:'Rent',amt:1100,due:1,paid:{[m]:true}},{id:uid(),name:'Phone',amt:45,due:12,paid:{}},{id:uid(),name:'Internet',amt:60,due:18,paid:{}},{id:uid(),name:'Streaming',amt:15,due:22,paid:{}}],
spend:[{id:uid(),amt:42.5,cat:'Food',note:'Groceries',date:m+'-03'},{id:uid(),amt:18,cat:'Transport',note:'Bus pass top-up',date:m+'-05'},{id:uid(),amt:64,cat:'Food',note:'Weekly shop',date:m+'-09'}],
goals:[{id:uid(),name:'Emergency fund',target:1000,saved:350},{id:uid(),name:'Trip',target:600,saved:120}]}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.income)S=DEMO?sample():{cur:'$',dark:false,focus:false,income:[],bills:[],spend:[],goals:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mut(fn){if(DEMO&&changes>=LIMIT){locked=true;render();return}fn();if(DEMO)changes++;save();render()}
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>S.cur+(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2});
const inM=d=>d.slice(0,7)===month;
function calc(){const inc=S.income.filter(x=>inM(x.date)).reduce((a,b)=>a+b.amt,0);
const bills=S.bills.reduce((a,b)=>a+b.amt,0);const sp=S.spend.filter(x=>inM(x.date)).reduce((a,b)=>a+b.amt,0);
const safe=inc-bills-sp;const [y,m]=month.split('-').map(Number);const dim=new Date(y,m,0).getDate();
const now=new Date();const left=month===mk()?Math.max(1,dim-now.getDate()+1):dim;return{inc,bills,sp,safe,left,day:Math.max(0,safe)/left}}
function today(){const c=calc();
const hero=`<div class="card hero"><div class="lbl">Safe to spend</div><div class="big ${c.safe<0?'neg':''}">${f(c.safe)}</div><div class="sub">${c.safe<0?'Over by '+f(-c.safe)+'. No panic, just pause new spending.':'About '+f(c.day)+' a day for the rest of the month'}</div></div>`;
if(S.focus)return hero;
const quick=`<div class="card"><h2 style="margin-top:0">Add a spend (3 taps)</h2><div class="chips">${CATS.map(k=>`<button class="${k===cat?'on':''}" onclick="cat='${k}';render()">${k}</button>`).join('')}</div>
<div class="form" style="margin-top:10px"><input id="qa" type="number" inputmode="decimal" placeholder="Amount"><input id="qn" placeholder="Note (optional)"><button class="full" onclick="addSpend()">Done</button></div></div>`;
const due=S.bills.filter(b=>!b.paid[month]).sort((a,b)=>a.due-b.due).slice(0,3);
const next=`<div class="card three"><h2 style="margin-top:0">Right now: 3 small things</h2>${due.length?due.map(b=>`<div><i>🧾</i><span style="flex:1">Pay ${e(b.name)} (day ${b.due})</span><b>${f(b.amt)}</b></div>`).join(''):'<div><i>🎉</i><span>All bills paid. Nice.</span></div>'}</div>`;
const tot=`<div class="card"><div class="row"><span class="grow">Income</span><span class="amt">${f(c.inc)}</span></div><div class="row"><span class="grow">Bills</span><span class="amt">-${f(c.bills)}</span></div><div class="row"><span class="grow">Spent</span><span class="amt">-${f(c.sp)}</span></div></div>`;
return hero+quick+next+tot}
function addSpend(){const a=parseFloat(document.getElementById('qa').value);if(!(a>0))return;const n=document.getElementById('qn').value.trim();mut(()=>S.spend.unshift({id:uid(),amt:a,cat,note:n||cat,date:month===mk()?new Date().toISOString().slice(0,10):month+'-01'}))}
function list(arr,fn){return arr.length?arr.map(fn).join(''):'<div class="sub" style="padding:10px 0">Nothing here yet.</div>'}
function pay(){return `<h2>Paychecks</h2><div class="card"><div class="form"><input id="pn" placeholder="Name"><input id="pa" type="number" inputmode="decimal" placeholder="Amount"><input id="pd" type="date" class="full" value="${month}-01"><button class="full" onclick="addPay()">Add paycheck</button></div></div>
<div class="card">${list(S.income.filter(x=>inM(x.date)),x=>`<div class="row"><div class="grow"><b>${e(x.name)}</b><span class="sub">${x.date}</span></div><span class="amt">${f(x.amt)}</span><button class="x" onclick="del('income','${x.id}')">×</button></div>`)}</div>`}
function addPay(){const a=parseFloat(pa.value);if(!(a>0))return;mut(()=>S.income.push({id:uid(),name:pn.value.trim()||'Paycheck',amt:a,date:pd.value||month+'-01'}))}
function bills(){const paid=S.bills.filter(b=>b.paid[month]).reduce((a,b)=>a+b.amt,0),tot=S.bills.reduce((a,b)=>a+b.amt,0);
return `<h2>Bills</h2><div class="card"><div class="sub">${f(paid)} of ${f(tot)} paid</div><div class="bar" style="margin-top:8px"><i style="width:${tot?paid/tot*100:0}%"></i></div></div>
<div class="card"><div class="form"><input id="bn" placeholder="Bill name"><input id="ba" type="number" inputmode="decimal" placeholder="Amount"><input id="bd" type="number" placeholder="Due day (1-31)" class="full"><button class="full" onclick="addBill()">Add bill</button></div></div>
<div class="card">${list([...S.bills].sort((a,b)=>a.due-b.due),b=>`<div class="row"><button class="chk ${b.paid[month]?'on':''}" onclick="togBill('${b.id}')">${b.paid[month]?'✓':''}</button><div class="grow"><b>${e(b.name)}</b><span class="sub">due day ${b.due}</span></div><span class="amt">${f(b.amt)}</span><button class="x" onclick="del('bills','${b.id}')">×</button></div>`)}</div>`}
function addBill(){const a=parseFloat(ba.value);if(!(a>0))return;mut(()=>S.bills.push({id:uid(),name:bn.value.trim()||'Bill',amt:a,due:Math.min(31,Math.max(1,parseInt(bd.value)||1)),paid:{}}))}
function togBill(id){mut(()=>{const b=S.bills.find(x=>x.id===id);b.paid[month]=!b.paid[month]})}
function spend(){const rows=S.spend.filter(x=>inM(x.date));const by={};rows.forEach(r=>by[r.cat]=(by[r.cat]||0)+r.amt);
return `<h2>Spending</h2><div class="card">${Object.keys(by).length?Object.entries(by).map(([k,v])=>`<div class="row"><span class="grow">${k}</span><span class="amt">${f(v)}</span></div>`).join(''):'<div class="sub">Add a spend on the Today screen.</div>'}</div>
<div class="card">${list(rows,x=>`<div class="row"><div class="grow"><b>${e(x.note)}</b><span class="sub">${x.cat} · ${x.date}</span></div><span class="amt">${f(x.amt)}</span><button class="x" onclick="del('spend','${x.id}')">×</button></div>`)}</div>`}
function sav(){return `<h2>Savings goals</h2><div class="card"><div class="form"><input id="gn" placeholder="Goal name"><input id="gt" type="number" inputmode="decimal" placeholder="Target"><button class="full" onclick="addGoal()">Add goal</button></div></div>
${S.goals.map(g=>`<div class="card"><div class="row" style="border:0;padding:0"><b class="grow">${e(g.name)}</b><span class="amt">${f(g.saved)} / ${f(g.target)}</span><button class="x" onclick="del('goals','${g.id}')">×</button></div><div class="bar" style="margin:10px 0"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div><div class="chips"><button onclick="addSaved('${g.id}',10)">+10</button><button onclick="addSaved('${g.id}',25)">+25</button><button onclick="addSaved('${g.id}',50)">+50</button><button onclick="addSaved('${g.id}',100)">+100</button></div></div>`).join('')}`}
function addGoal(){const t=parseFloat(gt.value);if(!(t>0))return;mut(()=>S.goals.push({id:uid(),name:gn.value.trim()||'Goal',target:t,saved:0}))}
function addSaved(id,n){mut(()=>S.goals.find(g=>g.id===id).saved+=n)}
function more(){return `<h2>Settings</h2><div class="card"><div class="row"><span class="grow">Currency symbol</span><input style="width:90px" value="${e(S.cur)}" maxlength="3" onchange="S.cur=this.value||'$';save();render()"></div>
<div class="row"><span class="grow">Dark mode</span><button class="ghost" onclick="S.dark=!S.dark;save();render()">${S.dark?'On':'Off'}</button></div>
<div class="row"><span class="grow">Focus mode (only Safe to spend)</span><button class="ghost" onclick="S.focus=!S.focus;save();render()">${S.focus?'On':'Off'}</button></div></div>
<h2>Backup</h2><div class="card"><div class="sub" style="margin-bottom:10px">Your data lives only in this browser. Save a backup file now and then, and before changing phones.</div><div class="form"><button onclick="backup()">Download backup</button><button class="ghost" onclick="document.getElementById('rf').click()">Restore backup</button></div><input id="rf" type="file" accept=".json" hidden onchange="restore(this)"></div>`}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='calm-budget-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(el){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.income)throw 0;S=d;save();render();alert('Backup restored.')}catch(x){alert('That file is not a Calm Budget backup.')}};if(el.files[0])r.readAsText(el.files[0])}
function del(k,id){mut(()=>S[k]=S[k].filter(x=>x.id!==id))}
function shiftM(n){const [y,m]=month.split('-').map(Number);const d=new Date(y,m-1+n,1);month=d.toISOString().slice(0,7).replace(/^(\d{4}-\d{2}).*/,'$1');const p=n=>String(n).padStart(2,'0');month=d.getFullYear()+'-'+p(d.getMonth()+1);render()}
function render(){document.body.classList.toggle('dark',!!S.dark);const mn=new Date(month+'-01T12:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
const body={today,pay,bills,spend,sav,more}[tab]();
const nav=[['today','🏠','Today'],['pay','💵','Paychecks'],['bills','🧾','Bills'],['spend','🛒','Spending'],['sav','🐷','Savings'],['more','⚙️','More']];
document.getElementById('app').innerHTML=(DEMO?`<div class="demo">FREE DEMO · sample data · ${Math.max(0,LIMIT-changes)} free changes left</div>`:'')+
`<div class="wrap"><div class="top"><button class="ghost" onclick="shiftM(-1)">‹</button><h1>${mn}</h1><button class="ghost" onclick="shiftM(1)">›</button></div>${body}</div>
<nav>${nav.map(n=>`<button class="${tab===n[0]?'on':''}" onclick="tab='${n[0]}';render();scrollTo(0,0)"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`+
(locked?`<div class="lock"><div><h1>Demo limit reached</h1><p>You have used all ${LIMIT} free changes. Love it? Get the full app on Etsy: no limits, no subscription, no account.</p><button onclick="locked=false;render()">Keep looking around</button></div></div>`:'')}
load();render();
</script></body></html>
